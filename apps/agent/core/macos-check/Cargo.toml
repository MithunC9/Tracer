[package]
name = "tracer-core-macos-check"
version = "0.0.0"
publish = false
description = "Type-checks the macOS capture source from Linux: cargo clippy --manifest-path apps/agent/core/macos-check/Cargo.toml --target aarch64-apple-darwin"
edition = "2021"
[workspace]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
url = "2"
hex = "0.4"
thiserror = "2"
log = "0.4"
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard"] }
core-foundation = "0.10"
