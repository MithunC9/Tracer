name: ci
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tracer
          POSTGRES_PASSWORD: tracer
          POSTGRES_DB: tracer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tracer" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://tracer:tracer@localhost:5432/tracer
      TEST_DATABASE_URL: postgres://tracer:tracer@localhost:5432/tracer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Analysis eval on the fixtures (recall >= 80%, precision >= 75%)
        run: pnpm --filter @tracer/analysis eval
      - name: Every fixture report validates with the real deps (numbers gate)
        run: pnpm verify:reports
      - name: docker-compose.yml is valid
        run: docker compose config -q
      - name: OpenAPI is up to date
        run: pnpm openapi && git diff --exit-code docs/openapi.json
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  # The same end-to-end test `pnpm test` runs, but with the real Rust agent (tracer-sim) doing
  # pairing, redaction and upload instead of the HTTP fallback.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tracer
          POSTGRES_PASSWORD: tracer
          POSTGRES_DB: tracer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tracer" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tracer:tracer@localhost:5432/tracer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/agent/core }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@tracer/api... --filter=@tracer/fixtures
      - run: cargo build --release --manifest-path apps/agent/core/Cargo.toml --bin tracer-sim
      - run: pnpm test:e2e

  agent-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/agent/core }
      - run: cargo test --manifest-path apps/agent/core/Cargo.toml
      - run: cargo clippy --manifest-path apps/agent/core/Cargo.toml -- -D warnings
