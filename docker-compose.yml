# Local stack. `pnpm dev` uses only the `postgres` service (and runs API + web on the host).
#
#   docker compose up -d postgres            # database only (what pnpm dev does)
#   docker compose up --build api            # + API in a container (migrates, then starts)
#   docker compose --profile web up --build  # + web app (next start) in a container
#
# Secrets come from .env (copy .env.example). The API container runs with NODE_ENV=development
# by default because .env.example holds dev-only secrets, which production mode rejects. For a
# real deployment set NODE_ENV=production with real JWT_SECRET / MASTER_KEY and HTTPS.

name: tracer

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tracer
      POSTGRES_PASSWORD: tracer
      POSTGRES_DB: tracer
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracer -d tracer"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${API_NODE_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Inside the compose network the database host is `postgres`, not localhost.
      DATABASE_URL: postgres://tracer_app:tracer_app@postgres:5432/tracer
      DATABASE_ADMIN_URL: postgres://tracer:tracer@postgres:5432/tracer
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    # Migrations are idempotent; they set the tracer_app password from DATABASE_URL.
    command: ["sh", "-c", "node dist/scripts/migrate.js && exec node dist/main.js"]
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Baked into the browser bundle at build time: the API as the browser sees it.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
